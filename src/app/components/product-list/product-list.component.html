<mat-toolbar color="primary" class="toolbar">
  <span class="title">Productos disponibles</span>
  <span class="spacer"></span>
  <button
    mat-fab
    color="accent"
    aria-label="Agregar producto"
    [routerLink]="['/products/add']"
  >
    <mat-icon>add</mat-icon>
  </button>
</mat-toolbar>

<div class="content">
  <mat-spinner *ngIf="loading" diameter="48"></mat-spinner>

  <div *ngIf="!loading && errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div class="product-grid" *ngIf="!loading && !errorMessage">
    <mat-card *ngFor="let product of products" class="product-card">
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>${{ product.price }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <img
          *ngIf="product.images"
          [src]="product.images"
          (error)="onImageError($event)"
          alt="{{ product.name }}"
          class="product-image"
        />
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-icon-button color="primary" (click)="editProduct(product)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="removeProduct(product)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
