<mat-toolbar color="primary" class="toolbar">
  <span class="title">Productos disponibles</span>
  <span class="spacer"></span>
  <button
    mat-fab
    color="accent"
    aria-label="Agregar producto"
    [routerLink]="['/products/add']"
  >
    <mat-icon>add</mat-icon>
  </button>
</mat-toolbar>

<div class="search-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar producto</mat-label>
    <input 
      matInput 
      type="text" 
      [(ngModel)]="searchTerm" 
      (ngModelChange)="applyFilter()" />
    <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Limpiar" (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
</div>

<div class="content">
  <mat-spinner *ngIf="loading" diameter="48"></mat-spinner>

  <div *ngIf="!loading && errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div class="product-grid" *ngIf="!loading && !errorMessage">
    <app-product-card
      *ngFor="let product of paginatedProducts"
      [product]="product"
      (delete)="confirmDelete(product)"
    ></app-product-card>
  </div>

  <mat-paginator
    *ngIf="filteredProducts.length > pageSize"
    [length]="filteredProducts.length"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 15]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
