<mat-card class="add-product-form">

  <h2>Agregar Producto</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Título -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" required />
      <mat-error *ngIf="form.get('title')?.hasError('required')">
        El título es obligatorio.
      </mat-error>
    </mat-form-field>

    <!-- Precio -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price" required />
      <mat-error *ngIf="form.get('price')?.hasError('required')">
        El precio es obligatorio.
      </mat-error>
      <mat-error *ngIf="form.get('price')?.hasError('min')">
        El precio debe ser mayor o igual a 0.
      </mat-error>
    </mat-form-field>

    <!-- Descripción -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

    <!-- Categoría -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Selecciona Categoría</mat-label>
      <mat-select formControlName="categoryId" required>
        <mat-option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('categoryId')?.hasError('required')">
        El ID de categoría es obligatorio.
      </mat-error>
      <mat-error *ngIf="form.get('categoryId')?.hasError('min')">
        El ID debe ser mayor a 0.
      </mat-error>
    </mat-form-field>

    <!-- Imágenes -->
    <div formArrayName="images">
      <div *ngFor="let image of images.controls; let i = index" class="image-field">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>URL Imagen {{ i + 1 }}</mat-label>
          <input matInput [formControlName]="i" />
          <button mat-icon-button color="warn" type="button" (click)="removeImage(i)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <button mat-button color="primary" type="button" (click)="addImage()">Añadir Imagen</button>
    </div>

    <!-- Botones -->
    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Guardar
      </button>
      <button mat-button type="button" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</mat-card>
